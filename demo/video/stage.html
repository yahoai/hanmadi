<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hanmadi demo stage</title>
<style>
@font-face{font-family:"IBM Plex Sans";font-weight:400;src:url(/app/ui/fonts/IBMPlexSans-Regular.woff2)}
@font-face{font-family:"IBM Plex Sans";font-weight:600;src:url(/app/ui/fonts/IBMPlexSans-SemiBold.woff2)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1440px;height:810px;overflow:hidden}
body{background:radial-gradient(120% 90% at 20% 0%,#EEF2F8 0%,#E3E9F2 55%,#D9E1EC 100%);font-family:"IBM Plex Sans",system-ui,sans-serif}
.win{position:absolute;left:80px;top:28px;width:1280px;height:690px;border-radius:12px;overflow:hidden;background:#fff;
  box-shadow:0 0 0 1px rgba(0,33,64,.10),0 30px 80px rgba(0,33,64,.22),0 8px 20px rgba(0,33,64,.10)}
.win{transition:transform 1.1s cubic-bezier(.4,0,.2,1);transform-origin:0 0}
.win iframe{width:100%;height:100%;border:0;display:block}
.lights{position:absolute;left:14px;top:14px;display:flex;gap:8px;z-index:2;pointer-events:none}
.lights i{width:12px;height:12px;border-radius:50%;display:block}
.cap{position:absolute;left:0;right:0;bottom:22px;text-align:center;opacity:0;transition:opacity .35s}
.cap.on{opacity:1}
.cap span{display:inline-block;background:#002140;color:#fff;font-size:24px;line-height:34px;padding:10px 24px;border-radius:12px;font-weight:600;letter-spacing:-.01em}
.card{position:absolute;inset:0;z-index:20;display:grid;place-items:center;text-align:center;background:#002140;color:#fff;opacity:0;transition:opacity .5s;pointer-events:none}
.card.on{opacity:1}
.card img{width:96px;height:96px;border-radius:22px;margin:0 auto 26px;display:block}
.card h1{font-size:64px;line-height:72px;font-weight:600;letter-spacing:-.02em}
.card p{font-size:28px;line-height:40px;color:#AEBBCB;margin-top:14px}
.card small{display:block;margin-top:34px;font-size:22px;color:#FA6855;font-weight:600}
#cursor{position:absolute;left:0;top:0;width:28px;height:28px;z-index:10;pointer-events:none;transition:transform .55s cubic-bezier(.4,0,.2,1);transform:translate(1500px,900px)}
#cursor svg{width:28px;height:28px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
#cursor.down svg{transform:scale(.85)}
#file{position:absolute;left:0;top:0;z-index:9;pointer-events:none;display:flex;align-items:center;gap:10px;background:#fff;border-radius:10px;padding:10px 14px;
  box-shadow:0 10px 30px rgba(0,33,64,.25);font-size:15px;color:#002140;font-weight:600;opacity:0;transition:transform .9s cubic-bezier(.4,0,.2,1),opacity .3s}
#file b{width:30px;height:36px;border-radius:5px;background:#FA6855;display:grid;place-items:center;color:#fff;font-size:10px}
</style>
</head>
<body>
<div class="win"><div class="lights"><i style="background:#FF5F57"></i><i style="background:#FEBC2E"></i><i style="background:#28C840"></i></div>
  <iframe id="app" src="/app/ui/index.html"></iframe></div>
<div class="cap" id="cap"><span></span></div>
<div id="file"><b>M4A</b>Nimbus launch sync.m4a</div>
<div id="cursor"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.6L10 19z" fill="#111" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg></div>
<div class="card" id="card"><div><img src="/docs/assets/icon.png" alt=""><h1></h1><p></p><small></small></div></div>
<script>
const $ = s => document.querySelector(s);
window.stage = {
  caption(t){ const c=$("#cap"); if(!t){ c.classList.remove("on"); return; } c.querySelector("span").textContent=t; c.classList.add("on"); },
  card(h, p, s){ const c=$("#card"); if(!h){ c.classList.remove("on"); return; } c.querySelector("h1").textContent=h; c.querySelector("p").textContent=p||""; c.querySelector("small").textContent=s||""; c.classList.add("on"); },
  cursor(x, y){ $("#cursor").style.transform=`translate(${x-6}px,${y-4}px)`; },
  press(on){ $("#cursor").classList.toggle("down", on); },
  zoom(k, x, y){ $(".win").style.transform = k===1 ? "" : `translate(${720-x*k}px,${380-y*k}px) scale(${k})`; },
  file(x, y, show){ const f=$("#file"); f.style.transform=`translate(${x}px,${y}px)`; f.style.opacity=show?1:0; },
};
</script>
</body>
</html>
